<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Добавление нагрузки</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="page-scroll">

        <header class="page-header">

            <h1 class="page-title">
                Добавление нагрузки
            </h1>

        </header>

        <section class="add-content">

            <div class="draft-media">

                <div class="draft-media-item active">

                    <span class="draft-media-label">
                        Фото
                    </span>

                    <img
                        class="draft-preview"
                        src="{{ .Load.ImageURL }}"
                        alt="{{ .Load.Name }}"
                    >

                </div>

                <div class="draft-media-item">

                    <span class="draft-media-label">
                        Видео
                    </span>

                    <video
                        class="draft-video"
                        src="{{ .Load.VideoURL }}"
                        poster="{{ .Load.ImageURL }}"
                        muted
                        loop
                        playsinline
                        controls>
                    </video>

                </div>

            </div>

            <div class="form-field">

                <label for="name">
                    Название
                </label>

                <input
                    id="name"
                    class="form-control"
                    type="text"
                    value="{{ .Load.Name }}"
                >

            </div>

            <div class="form-field">

                <label for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    class="form-control"
                >{{ .Load.Description }}</textarea>

            </div>

            <div class="form-field">

                <label for="category">
                    Категория
                </label>

                <select
                    id="category"
                    class="form-control">

                    <option selected>
                        {{ .Load.Category }}
                    </option>

                    <option>
                        Обзорность
                    </option>

                    <option>
                        Терморегулирование батареи
                    </option>

                </select>

            </div>

            <div class="form-field">

                <label for="power">
                    Мощность (Вт)
                </label>

                <input
                    id="power"
                    class="form-control"
                    type="number"
                    value="{{ .Load.PowerDrawW }}"
                >

            </div>

            <div class="form-field">

                <label for="priority">
                    Приоритет
                </label>

                <select
                    id="priority"
                    class="form-control">

                    <option selected>
                        {{ .Load.Priority }}
                    </option>

                    <option>
                        Высокий
                    </option>

                    <option>
                        Средний
                    </option>

                    <option>
                        Низкий
                    </option>

                </select>

            </div>

            <p class="saving-note">
                Сохранение будет доступно позже
            </p>

        </section>

    </main>

    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/electric-car-loads/feed">

            <span class="nav-icon">▦</span>

            Лента

        </a>

        <a
            class="nav-item active"
            href="/electric-car-loads/add">

            <span class="nav-icon">⊕</span>

            Добавление

        </a>

        <a
            class="nav-item"
            href="/electric-car-loads">

            <span class="nav-icon">▦</span>

            Плитка

        </a>

    </nav>

</div>

</body>
</html>
