<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Добавление нагрузки</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="page-scroll">

        <header class="page-header">

            <h1 class="page-title">
                Добавление нагрузки
            </h1>

        </header>


        <section class="add-content">


            <div class="draft-media">


                <div class="draft-media-item active">

                    <label class="draft-media-label">
                        Фото

                        <input
                            type="file"
                            accept="image/*"
                            hidden
                        >

                    </label>


                    <img
                        class="draft-preview"
                        src="{{ .Load.ImageURL }}"
                        alt="Предварительный просмотр изображения"
                    >

                </div>



                <div class="draft-media-item">

                    <label class="draft-media-label">
                        Видео

                        <input
                            type="file"
                            accept="video/*"
                            hidden
                        >

                    </label>


                    <video
                        class="draft-video"
                        src="{{ .Load.VideoURL }}"
                        poster="{{ .Load.ImageURL }}"
                        muted
                        loop
                        playsinline
                        controls>
                    </video>


                </div>


            </div>



            <div class="form-field">

                <label for="name">
                    Название
                </label>


                <input
                    id="name"
                    class="form-control"
                    type="text"
                    placeholder="Введите название нагрузки"
                >

            </div>




            <div class="form-field">

                <label for="description">
                    Описание
                </label>


                <textarea
                    id="description"
                    class="form-control"
                    placeholder="Введите описание нагрузки"
                ></textarea>


            </div>


        </section>


    </main>



    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/electric-car-loads/feed">

            <span class="nav-icon">▦</span>

            Лента

        </a>



        <a
            class="nav-item active"
            href="/electric-car-loads/add">

            <span class="nav-icon">⊕</span>

            Добавление

        </a>



        <a
            class="nav-item"
            href="/electric-car-loads">

            <span class="nav-icon">▦</span>

            Плитка

        </a>


    </nav>


</div>


</body>
</html>
