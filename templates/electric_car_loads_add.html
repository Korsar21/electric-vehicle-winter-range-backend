<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Добавление нагрузки</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="page-scroll">

        <header class="page-header">
            <h1 class="page-title">
                Добавление нагрузки
            </h1>
        </header>


        {{ if not .HasDraft }}

        <!-- Ы Т: С  -->

        <form
            class="add-content"
            method="POST"
            action="/electric-car-loads/add"
        >

            <div class="draft-media">

                <div class="draft-media-item active">

                    <label class="draft-media-label">
                        Фото

                        <input
                            type="file"
                            name="image"
                            accept="image/*"
                            hidden
                        >
                    </label>

                    <img
                        class="draft-preview"
                        src="/static/media/default.jpg"
                        alt="Фото по умолчанию"
                    >

                </div>


                <div class="draft-media-item">

                    <label class="draft-media-label">
                        Видео

                        <input
                            type="file"
                            name="video"
                            accept="video/*"
                            hidden
                        >
                    </label>

                    <video
                        class="draft-video"
                        src="/static/media/default.mp4"
                        poster="/static/media/default.jpg"
                        muted
                        loop
                        playsinline
                        controls>
                    </video>

                </div>

            </div>


            <div class="form-field">

                <label for="name">
                    Название
                </label>

                <input
                    id="name"
                    name="name"
                    class="form-control"
                    type="text"
                    placeholder="Введите название нагрузки"
                    required
                >

            </div>


            <button
                type="submit"
                class="form-button"
            >
                Далее
            </button>

        </form>


        {{ else }}

        <!-- Т Т: Я  -->

        <form
            class="add-content"
            method="POST"
            action="/electric-car-loads/{{ .Load.ID }}/publish"
        >

            <div class="draft-media">

                <div class="draft-media-item active">

                    <div class="draft-media-label">
                        Фото
                    </div>

                    <img
                        class="draft-preview"
                        src="{{ .Load.ImageURL }}"
                        alt="Фото нагрузки"
                    >

                </div>


                <div class="draft-media-item">

                    <div class="draft-media-label">
                        Видео
                    </div>

                    <video
                        class="draft-video"
                        src="{{ .Load.VideoURL }}"
                        poster="{{ .Load.ImageURL }}"
                        muted
                        loop
                        playsinline
                        controls>
                    </video>

                </div>

            </div>


            <div class="form-field">

                <label for="name">
                    Название
                </label>

                <input
                    id="name"
                    name="name"
                    class="form-control"
                    type="text"
                    value="{{ .Load.Name }}"
                    readonly
                >

            </div>


            <div class="form-field">

                <label for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    name="description"
                    class="form-control"
                    placeholder="Введите описание нагрузки"
                    required
                >{{ .Load.Description }}</textarea>

            </div><div class="form-field">

                <label for="power">
                    Мощность (Вт)
                </label>

                <input
                    id="power"
                    name="power"
                    class="form-control"
                    type="number"
                    value="{{ .Load.PowerDrawW }}"
                    min="0"
                    max="10000"
                    placeholder="Например: 500"
                    required
                >

            </div>


            <div class="form-field">

                <label for="priority">
                    Приоритет
                </label>

                <input id="priority" name="priority" class="form-control" type="text" value="{{ .Load.Priority }}" required>

            </div>


            <button
                type="submit"
                class="form-button"
            >
                Опубликовать
            </button>

        </form>

        {{ end }}

    </main>


    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/electric-car-loads/feed">

            <span class="nav-icon">◻</span>

            Лента

        </a>


        <a
            class="nav-item active"
            href="/electric-car-loads/add">

            <span class="nav-icon">⊕</span>

            Добавление

        </a>


        <a
            class="nav-item"
            href="/electric-car-loads">

            <span class="nav-icon">◻</span>

            Плитка

        </a>

    </nav>

</div>

</body>
</html>
