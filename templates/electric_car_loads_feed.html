<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ .Load.Name }}</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="feed-page">

        <video
            class="feed-video"
            src="{{ .Load.VideoURL }}"
            poster="{{ .Load.ImageURL }}"
            autoplay
            muted
            loop
            playsinline>
        </video>

        <div class="feed-gradient"></div>

        <img
            class="feed-thumbnail"
            src="{{ .Load.ImageURL }}"
            alt="{{ .Load.Name }}"
        >

        <div class="feed-like">

            <span class="feed-heart">♡</span>

            <span>
                {{ .Load.LikeCount }}
            </span>

        </div>

        <section class="feed-content">

            <span class="category-badge">
                {{ .Load.Category }}
            </span>

            <h1 class="feed-title">
                {{ .Load.Name }}
            </h1>

            <div class="feed-description">

                <input
                    class="description-toggle"
                    id="description-toggle"
                    type="checkbox"
                >

                <p class="description-text">
                    {{ .Load.Description }}
                </p>

                <label
                    class="description-toggle-label"
                    for="description-toggle">
                </label>

            </div>

            <div class="feed-metrics">

                <div class="feed-metric">

                    <div class="metric-label">
                        Потребляемая мощность
                    </div>

                    <p class="metric-value">
                        {{ .Load.PowerDrawW }} Вт
                    </p>

                </div>

                <div class="feed-metric">

                    <div class="metric-label">
                        Приоритет
                    </div>

                    <p class="metric-priority">
                        {{ .Load.Priority }}
                    </p>

                </div>

            </div>

        </section>

        <a
            class="next-link"
            href="/electric-car-loads/feed?id={{ .Load.ID }}&next=true">

            Далее

            <span class="next-arrow">
                →
            </span>

        </a>

    </main>

    <nav class="bottom-nav">

        <a
            class="nav-item active"
            href="/electric-car-loads/feed">

            <span class="nav-icon">▦</span>

            Лента

        </a>

        <a
            class="nav-item"
            href="/electric-car-loads/add">

            <span class="nav-icon">⊕</span>

            Добавление

        </a>

        <a
            class="nav-item"
            href="/electric-car-loads">

            <span class="nav-icon">▦</span>

            Плитка

        </a>

    </nav>

</div>

</body>
</html>
