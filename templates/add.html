<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Draft Auxiliary Load</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="page-scroll">

        <header class="page-header">

            <div class="page-header-row">

                <h1 class="page-title">
                    Draft Auxiliary Load
                </h1>

                <span class="status-badge">
                    {{ .Load.Status }}
                </span>

            </div>

        </header>

        <section class="add-content">

            <img
                class="draft-preview"
                src="{{ .Load.ImageURL }}"
                alt="{{ .Load.Name }}"
            >

            <div class="form-field">

                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    class="form-control"
                    type="text"
                    value="{{ .Load.Name }}"
                >

            </div>

            <div class="form-field">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    class="form-control">{{ .Load.Description }}</textarea>

            </div>

            <div class="form-field">

                <label for="category">
                    Category
                </label>

                <select
    id="category"
    class="form-control">

    <option selected>
        {{ .Load.Category }}
    </option>

    <option>
        Visibility
    </option>

    <option>
        Battery Thermal Management
    </option>

</select>

            </div>

            <div class="form-field">

                <label for="power">
                    Power Draw (W)
                </label>

                <input
                    id="power"
                    class="form-control"
                    type="number"
                    value="{{ .Load.PowerDrawW }}"
                >

            </div>

            <div class="media-fields">

    <div class="media-field">

        <label for="imageKey">
            Image
        </label>

        <input
            id="imageKey"
            class="media-input"
            type="text"
            value="{{ .Load.ImageKey }}"
        >

    </div>

    <div class="media-field">

        <label for="videoKey">
            Video
        </label>

        <input
            id="videoKey"
            class="media-input"
            type="text"
            value="{{ .Load.VideoKey }}"
        >

    </div>

</div>

            <p class="saving-note">
                Saving available later
            </p>

        </section>

    </main>

    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/vehicle-auxiliary-loads/feed">

            <span class="nav-icon">▦</span>

            Feed

        </a>

        <a
            class="nav-item active"
            href="/vehicle-auxiliary-loads/draft">

            <span class="nav-icon">⊕</span>

            Add

        </a>

        <a
            class="nav-item"
            href="/vehicle-auxiliary-loads">

            <span class="nav-icon">▦</span>

            Grid

        </a>

    </nav>

</div>

</body>
</html>
