<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Электрические нагрузки автомобиля</title>

    <link
        rel="stylesheet"
        href="/static/styles/main.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="page-scroll">

        <header class="page-header">

            <h1 class="page-title">
                Электрические нагрузки автомобиля
            </h1>

        </header>

        <form
            class="grid-filter"
            method="GET"
            action="/electric-car-loads">

            <div class="filter-row">

                <span>
                    Максимальная мощность
                </span>

                <span class="filter-value">
                    {{ .MaxPowerW }} Вт
                </span>

            </div>

            <input
                class="power-range"
                id="maxPowerW"
                name="maxPowerW"
                type="range"
                min="0"
                max="5000"
                step="50"
                value="{{ .MaxPowerW }}"
            >

            <div class="range-labels">

                <span>
                    0 Вт
                </span>

                <span>
                    5000 Вт
                </span>

            </div>

            <button
                class="filter-button"
                type="submit">

                Применить фильтр

            </button>

        </form>

        <section class="load-grid">

            {{ range .Loads }}

            <article
    class="load-card"
    data-image-url="{{ .ImageURL }}"
    data-video-url="{{ .VideoURL }}">

                <a
                    class="load-card-link"
                    href="/electric-car-loads/feed?id={{ .ID }}">

                    <img
                        class="load-card-image"
                        src="{{ .ImageURL }}"
                        alt="{{ .Name }}"
                    >

                    <div class="load-card-body">

                        <h2 class="load-card-title">
                            {{ .Name }}
                        </h2>

                        <div class="load-card-meta">

                            <span class="load-power">
                                {{ .PowerDrawW }} W
                            </span>

                            <span class="load-priority">
                                {{ .Priority }}
                            </span>

                            <span class="load-likes">
                                ♡ {{ .LikeCount }}
                            </span>

                        </div>

                    </div>

                </a>

            </article>

            {{ end }}

        </section>

    </main>

    <nav class="bottom-nav">

        <a
            class="nav-item"
            href="/electric-car-loads/feed">

            <span class="nav-icon">▦</span>

            Лента

        </a>

        <a
            class="nav-item"
            href="/electric-car-loads/add">

            <span class="nav-icon">⊕</span>

            Добавление

        </a>

        <a
            class="nav-item active"
            href="/electric-car-loads">

            <span class="nav-icon">▦</span>

            Плитка

        </a>

    </nav>

</div>

</body>
</html>
