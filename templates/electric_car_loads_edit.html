<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Редактирование нагрузки</title>

<link rel="stylesheet" href="/static/styles/main.css">

</head>


<body>


<div class="app-shell">


<main class="page-scroll">


<header class="page-header">

<h1 class="page-title">
Редактирование нагрузки
</h1>

</header>



<form
class="add-content"
method="POST"
action="/electric-car-loads/{{ .Load.ID }}/edit">



<div class="form-field">

<label>
Название
</label>


<input

class="form-control"

name="name"

type="text"

value="{{ .Load.Name }}"

>


</div>




<div class="form-field">


<label>
Описание
</label>


<textarea

class="form-control"

name="description"

>{{ .Load.Description }}</textarea>


</div>




<button
type="submit"
class="form-button">

Сохранить

</button>


</form>


</main>



</div>


</body>

</html>
