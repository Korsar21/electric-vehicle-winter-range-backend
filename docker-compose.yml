services:

  postgres:
    image: postgres:16
    container_name: electric_car_loads_postgres
    restart: always

    environment:
      POSTGRES_DB: electric_car_loads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  adminer:
    image: adminer
    container_name: electric_car_loads_adminer
    restart: always

    ports:
      - "8081:8080"


volumes:
  postgres_data: