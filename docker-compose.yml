services:

  postgres:
    image: postgres:16
    container_name: electric_car_loads_postgres
    restart: always
    environment:
      POSTGRES_DB: electric_car_loads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: electric_car_loads_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  redis:
    image: redis:6.2-alpine
    container_name: electric_car_loads_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
